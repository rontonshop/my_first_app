<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101219">
<title>Duo — Red & Blue</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101219;color:#f5f5fa;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
main{width:min(850px,100%)}header{margin-bottom:32px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:#a5a9bb}h1{font-size:clamp(40px,8vw,72px);letter-spacing:-.06em;margin:12px 0}p{color:#a5a9bb;line-height:1.6}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:20px}
button{font:inherit;color:white;border:1px solid #ffffff25;border-radius:28px;min-height:300px;padding:32px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,filter .15s;touch-action:manipulation}
button:hover{filter:brightness(1.1);transform:translateY(-3px)}button:active{transform:scale(.97)}button:focus-visible{outline:4px solid white;outline-offset:5px}
.red{background:linear-gradient(145deg,#d73549,#991b30);box-shadow:0 15px 60px #dc30451a}.blue{background:linear-gradient(145deg,#2563eb,#193997);box-shadow:0 15px 60px #2563eb1a}
.label{font-size:28px;font-weight:650}.count{font-size:76px;font-weight:750;letter-spacing:-.06em}.hint{font-size:14px;opacity:.8}footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;font-size:14px;color:#a5a9bb}
@media(max-width:520px){body{padding:20px}.buttons{gap:12px}button{min-height:250px;padding:22px;border-radius:22px}.count{font-size:60px}.label{font-size:24px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
<header><span class="eyebrow">A little experiment</span><h1>Two buttons.<br>Make your move.</h1><p>Pick a color. Give it a tap. See where you land.</p></header>
<div class="buttons">
<button class="red" id="red" aria-label="Red button, 0 taps"><span class="label">Red</span><span class="count" aria-hidden="true">0</span><span class="hint">Tap to add one ↗</span></button>
<button class="blue" id="blue" aria-label="Blue button, 0 taps"><span class="label">Blue</span><span class="count" aria-hidden="true">0</span><span class="hint">Tap to add one ↗</span></button>
</div>
<footer><span id="status" role="status" aria-live="polite" aria-atomic="true">Your first tap is up next.</span><span>Just you and two buttons.</span></footer>
</main>
<script>
const counts = {red: 0, blue: 0};
for (const color of ['red', 'blue']) {
  const button = document.getElementById(color);
  button.addEventListener('click', () => {
    counts[color] += 1;
    button.querySelector('.count').textContent = counts[color];
    button.setAttribute('aria-label', color + ' button, ' + counts[color] + ' taps');
    const total = counts.red + counts.blue;
    document.getElementById('status').textContent = total + (total === 1 ? ' tap' : ' taps') + ' total · Last pick: ' + color;
  });
}
</script>
</body>
</html>
